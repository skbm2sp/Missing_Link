<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: night shift at a museum intake window, after Papers, Please.
   IDEA: a dark office behind the counter, a silhouetted reporter, a teal desk, a shelf of instruments below.
   PICTURE: pixel scenery drawn on small canvases and scaled up; papers in cream, lilac and pink.
   COLOUR and TYPE: dark browns and greys, muted teal desk, red and green stamps. VT323 for text, Silkscreen for labels.
   LAYOUT: fixed 1280x960 stage (4:3, fits iPads exactly) scaled to the screen. */
:root{--ts:1;--t:"VT323","Courier New",monospace;--l:"Silkscreen","Courier New",monospace;--line:#1b1714;--ink:#2b2622;--muted:#6d6456;--red:#b83a2e;--grn:#4f7a24;--amber:#e0b04a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden;font:22px/1.1 var(--t);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-touch-callout:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:var(--Wp,1280px);height:960px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:#1a1613}
.layer{position:absolute}
#desk{left:0;top:330px;width:var(--Wp,1280px);height:530px;background-color:#6f9284}
#world{position:absolute;inset:0;pointer-events:none}#world>*{pointer-events:auto}
#sil{position:absolute;left:calc(540px + var(--off,0px));top:12px;width:200px;height:240px;transition:transform .6s steps(8)}
#sil.out{transform:translateX(calc(-760px - var(--off,0px)))}#sil.gone{transform:translateX(calc(760px + var(--off,0px)))}
#bubbles{position:absolute;left:0;top:0;width:var(--Wp,1280px);height:250px;pointer-events:none}
.bub{position:absolute;max-width:300px;background:#efe9d8;border:3px solid var(--line);padding:5px 10px;font:calc(24px*var(--ts))/1.05 var(--t);color:var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.45)}
#handZone{position:absolute;left:0;top:250px;width:var(--Wp,1280px);height:80px;pointer-events:none;z-index:2}
#handZone.hot{outline:5px dashed var(--amber);outline-offset:-8px;background:rgba(224,176,74,.18)}
#handZone.hot:after{content:"HAND BACK";position:absolute;left:0;right:0;top:28px;text-align:center;font:13px var(--l);color:#1d2a22}
/* shelf */
.shelfitem{position:absolute}
#caseplate{left:18px;top:868px;width:176px;height:84px;background:#e9e1c3;border:4px solid var(--line);box-shadow:inset 0 0 0 3px #cfc49f;padding:4px 10px;line-height:1}
#caseplate b{display:block;font:700 26px/1 var(--l);color:#2b2622}
#caseplate span{font:18px/1 var(--t);color:var(--muted);white-space:nowrap}
#pauseBtn{left:412px;top:880px;width:124px;height:64px;padding:0;font-size:13px}
.scr.pause{background:rgba(13,11,10,.96)}
.pmenu{width:540px;background:#e5dcc4;color:var(--ink);border:4px solid var(--line);box-shadow:10px 10px 0 #000;padding:26px 32px 14px;text-align:center}
.pmenu h1{font:700 48px/1 var(--l);margin:0 0 6px}.psub{font:24px var(--t);color:var(--muted);margin-bottom:22px}
.pmenu .btn{display:block;width:100%;height:60px;margin:0 0 14px;font-size:15px}.pmenu p{font:calc(24px*var(--ts))/1.1 var(--t);margin:0 0 18px}
.btn.red{background:#c9705d;box-shadow:inset 0 -6px 0 #8f3a2e;color:#1e0e0a}
#speaker{left:548px;top:878px;width:176px;height:72px;border:0;padding:0;background:none}
#speaker canvas{width:176px;height:72px}
#speaker em{position:absolute;left:0;right:0;bottom:-2px;font:10px var(--l);font-style:normal;color:#d8c9a8;text-align:center}
#idcard{left:calc(1056px + var(--R,0px));top:868px;width:212px;height:86px;background:#ece7da;border:4px solid var(--line);box-shadow:inset 0 0 0 3px #d2cbb8;padding:4px 8px;overflow:hidden}
#idcard .ih{font:8px var(--l);color:#fff;background:#3b4a5c;margin:-4px -8px 4px;padding:3px 8px;white-space:nowrap;overflow:hidden}
#idcard .pr{display:flex;align-items:center;gap:6px;height:30px;margin-bottom:3px}

#idcard .pr.big{height:50px;margin:0}#idcard .pr.big canvas{width:38px;height:46px}#idcard .pr.big .nm{line-height:1}#idcard .pr.big .sc{font-size:15px}
#idcard .pr .nm{font-size:17px}
#idcard .nm{font:19px/1 var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#idcard .sc{font:16px/1 var(--t);color:var(--muted)}
#nomanual{left:calc(748px + var(--off,0px));top:878px;width:284px;height:70px;background:#e9e1c3;border:4px solid var(--line);padding:8px 10px;font:20px/1 var(--t);color:var(--ink);transform:rotate(-2deg);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
#nocalc{left:224px;top:878px;width:176px;height:70px;background:#e9e1c3;border:4px solid var(--line);padding:8px 10px;font:19px/1 var(--t);color:var(--ink);transform:rotate(2deg);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
#nocalc b{display:block;font:700 10px var(--l);color:var(--red);margin-bottom:4px}
#caseplate.warn #pTime{color:var(--red);animation:blink2 1s steps(2) infinite}@keyframes blink2{50%{opacity:.35}}
.stime{font:700 18px var(--l);color:#cfc8b4;text-align:center;margin:-6px 0 12px}
#nomanual b{display:block;font:700 11px var(--l);color:var(--red);margin-bottom:4px}
/* draggable objects */
.obj{position:absolute;touch-action:none;cursor:grab}
.obj.dragging{cursor:grabbing;filter:drop-shadow(8px 10px 0 rgba(0,0,0,.35))}
.fly{transition:left .3s steps(7),top .3s steps(7)}

/* folder */
.folder{width:460px;height:520px;perspective:1800px}
.fback{position:absolute;inset:0;background:#a8874a;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35),inset 0 0 0 6px #b8975a}
.ftab{position:absolute;left:260px;top:-22px;width:100px;height:26px;background:#c4a466;border:4px solid var(--line);border-bottom:0}
.fcover{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .4s steps(6)}
.folder.open .fcover{transform:rotateY(-179deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line)}
.front{background:#d2bf74;box-shadow:inset 0 -12px 0 #bba95f,inset 0 0 0 6px #dccb84;padding:36px 30px}
.inside{transform:rotateY(180deg);background:#c7b46b;box-shadow:inset 0 0 0 6px #b8a55c;padding:30px 28px;cursor:pointer}
.casetag{display:inline-block;font:700 34px/1 var(--l);color:var(--ink);border:4px solid var(--ink);padding:10px 16px;background:#e9dfb6}
.flabel{position:absolute;left:30px;right:30px;bottom:30px;font:calc(24px*var(--ts))/1.05 var(--t);color:#4a3e15}
.flabel span{display:block;font:12px var(--l);color:#6a5a25;margin-top:6px}
.inside p{font:calc(24px*var(--ts))/1.05 var(--t);color:#4a3e15;margin:0}
.closer{position:absolute;left:28px;right:28px;bottom:30px;border:4px dashed #6a5a25;padding:14px;text-align:center;font:calc(12px*var(--ts))/1.6 var(--l);color:#4a3e15}
/* papers */
.paper{width:440px;border:3px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.35);font:20px/1.02 var(--t);color:var(--ink);padding:5px}
.paper .in{border:2px solid rgba(0,0,0,.28);padding:7px 9px 9px;position:relative}
.paper .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(0,0,0,.35);padding-bottom:4px;margin-bottom:6px}
.paper .hd b{font:700 calc(14px*var(--ts)) var(--l)}.paper .hd span{font:calc(20px*var(--ts)) var(--t);color:var(--muted)}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0}
.paper dt{color:var(--muted)}.paper dd{margin:0}
.paper h5{margin:6px 0 1px;font:calc(11px*var(--ts)) var(--l);color:var(--muted)}
.paper ul{margin:0;padding-left:14px}.paper li{margin:0 0 1px}
.paper p{margin:0}
#lab{background:#e7dec6}#field{background:#d9d2e4}#idf{background:#ecd3cc}
.pct{font:44px/1 var(--t);color:var(--red)}
.row{display:flex;align-items:center;gap:8px;margin-top:5px}
.row label,.lbl{font:calc(11px*var(--ts)) var(--l);color:var(--muted)}
.paper input{height:calc(30px*var(--ts));border:0;border-bottom:2px solid var(--line);background:rgba(255,255,255,.45);font:calc(24px*var(--ts))/1 var(--t);padding:0 5px;border-radius:0;min-width:0}
.ptop{display:grid;grid-template-columns:86px 1fr;gap:9px;align-items:start}
.idphoto{width:86px;height:102px;border:3px solid var(--line);background:#b9b2a0;overflow:hidden}
.idphoto canvas{width:80px;height:96px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sbox{position:relative;height:96px;border:3px dashed #8a6a62;display:grid;place-items:center}
.sbox>em{position:absolute;left:5px;top:3px;font:calc(10px*var(--ts)) var(--l);font-style:normal;color:#7a5e57}
.ink{font:24px/.95 var(--t);text-transform:uppercase;border:4px solid currentColor;padding:4px 6px;text-align:center;opacity:.85;max-width:150px;transform:rotate(var(--r))}
.ink.P{color:var(--grn)}.ink.T{color:var(--red)}
.seal{position:absolute;right:8px;bottom:6px;font:11px var(--l);color:#7a5e57}
.gram{display:flex;flex-wrap:wrap;gap:0 18px;font:calc(23px*var(--ts))/1.1 var(--t);margin:2px 0 4px}.gram span{white-space:nowrap}.gram b{font:28px/1 var(--t);color:var(--red)}
.smudge{color:#8a7f6a;font-style:italic}.rd{display:inline-block;width:52%;height:13px;background:#2b2622;vertical-align:middle}
.nophoto{width:80px;height:96px;display:grid;place-items:center;text-align:center;font:calc(11px*var(--ts))/1.6 var(--l);color:#5a5246;background:repeating-linear-gradient(45deg,#b9b2a0 0 6px,#ada592 6px 12px)}
/* pixel dropdown */
.psel{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:32px;padding:0 6px;border:3px solid var(--line);background:#d8d0b8;box-shadow:inset 0 -4px 0 #a99f84;font:calc(23px*var(--ts))/1 var(--t);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.psel i{font-style:normal;font-size:14px;flex:none}
.psel.empty span{color:var(--muted)}
.plist{position:absolute;z-index:95000;background:#e3dcc6;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4);max-height:380px;overflow:auto;padding:3px;touch-action:pan-y}
.plist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 8px;font:calc(23px*var(--ts))/1.05 var(--t);min-height:32px}
.plist button:hover,.plist button.on{background:#3b4a32;color:#e9eed6}
.plist .grp{font:calc(10px*var(--ts)) var(--l);color:var(--muted);padding:6px 8px 2px}
/* manual (no page animation) */
.book{width:310px;height:480px}
.book.open{width:620px}
.bcase{position:absolute;inset:-7px;background:#6e2520;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.pg{position:absolute;top:0;width:310px;height:480px;background:#e9e1c9;border:3px solid var(--line);padding:12px 14px 28px;overflow:hidden;font:calc(21px*var(--ts))/1.02 var(--t)}
.pgL{left:0}.pgR{left:310px}
.pgW{left:0;width:620px}
.pg h3{margin:0 0 6px;font:700 calc(13px*var(--ts)) var(--l);color:#2f3a2a}
.pg h4{margin:7px 0 1px;font:calc(11px*var(--ts)) var(--l);color:#7a2a20}
.pg p,.pg li{margin:2px 0}.pg ol{margin:0;padding-left:calc(22px*var(--ts));font-size:calc(20px*var(--ts));line-height:1}.pg ol li{margin:0 0 5px}
.pg table{border-collapse:collapse;width:100%;font:calc(20px*var(--ts))/1 var(--t)}
.pg td,.pg th{border:2px solid #b5a988;padding:1px 4px;text-align:left;vertical-align:top}.pg th{background:#d6caa8;font:calc(10px*var(--ts)) var(--l)}
.pg .nw td{white-space:nowrap}
.pg .ts tr.era td{background:#e0d4b2;font:700 calc(10px*var(--ts))/16px var(--l);color:#7a2a20}
.pg .removed{font:700 calc(12px*var(--ts)) var(--l);color:var(--red);border:3px solid var(--red);padding:6px;text-align:center;margin:10px 0 12px;transform:rotate(-3deg)}
.gsel{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gsel .lbl{flex:none}
#gtable{height:360px;overflow:auto;touch-action:pan-y;font-size:calc(18px*var(--ts));position:relative}
#gtable table{table-layout:fixed;font-size:calc(18px*var(--ts))}#gtable th:first-child{width:158px}
#gtable td:first-child{font-weight:700;font-size:calc(16px*var(--ts));overflow-wrap:anywhere}
.pg.scrolly{overflow-y:auto;touch-action:pan-y;padding-bottom:14px}.pg.scrolly .pno{display:none}.pg.scrolly.more{box-shadow:inset 0 -18px 0 -10px #b5a988}
#gtable.more:after{content:"▼ SCROLL FOR MORE";position:sticky;bottom:0;display:block;text-align:center;background:#d6caa8;font:10px/18px var(--l);color:#2f3a2a}
.gnote{font:calc(18px*var(--ts)) var(--t);color:var(--muted);margin-top:4px}
.names{columns:3;column-gap:14px;font-size:calc(17px*(1 + (var(--ts) - 1)*.45));line-height:1.05}.names div{break-inside:avoid;overflow-wrap:anywhere;border-bottom:2px dotted #c8bc9b;padding:1px 0}
.pno{position:absolute;bottom:6px;font:10px var(--l);color:var(--muted)}
.pgL .pno,.pgW .pno{left:14px}.pgR .pno{right:14px}
.btabs{position:absolute;left:620px;top:14px;display:flex;flex-direction:column;gap:5px}
.btab{width:100px;height:40px;border:3px solid var(--line);border-left:0;padding:2px 6px 2px 10px;text-align:left;font:10px/1.3 var(--l);color:#241d10;box-shadow:4px 4px 0 rgba(0,0,0,.3)}

.book.open .cover{display:none}
.cover{position:absolute;inset:0;background:#a8362c;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4),inset 14px 0 0 #7d241c;padding:16px 16px 0 30px;color:#f1d9cf}

.cover canvas{width:96px;height:96px;margin:0 auto 18px}
.cover .bn{font:13px/1.7 var(--l);text-align:center}
/* calculator */
.calc{width:170px;height:236px;background:#2c2d2c;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4),inset 0 5px 0 #3e403e,inset 0 -7px 0 #1f201f;padding:10px}
.cdisp{height:40px;background:#9fc4d6;border:3px solid var(--line);box-shadow:inset 3px 3px 0 #7ea3b5;font:32px/32px var(--t);color:#1d2b33;text-align:right;padding:0 6px;overflow:hidden;white-space:nowrap;margin-bottom:8px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}

/* stamp bar */
#bar{position:absolute;top:334px;width:754px;height:233px;z-index:30000;transition:left .35s steps(7)}

/* envelope */
/* envelope: back, letter, front pocket and flap are separate layers, so the letter slides out
   in front of the opened flap and stays tucked behind the pocket */

.env>canvas{position:absolute;left:0;width:300px}

.sub{font:24px var(--t);color:#8d8572;text-align:center;margin:0 0 22px}

   each Rule pairs a validator with the message used when it fails. */
class Rule{constructor(validate,message){this.validate=validate;this.message=message}test(c){return this.validate(c)}}
class Ruleset{constructor(rules){this.rules=rules}failures(c){return this.rules.filter(r=>!r.test(c))}}

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
const nameOk=c=>{const t=norm(c.a.name);return t.length>2&&keyOf(c).name.some(n=>{const k=norm(n);return t===k||(k.length>=6&&lev(t,k)<=1)})};

function statusText(){const s=$("#fstat");if(s)s.textContent=FILING.failures(cur()).length?"CLICK TO OPEN":"COMPLETE · HAND IT BACK"}
function atCounter(el){const[,cy]=center(el);return cy<DESK_Y+120}
function openFolder(){if(F.classList.contains("open"))return;F.openedAt=Date.now();const x=clamp(F.offsetLeft,470,W-470),y=clamp(F.offsetTop,DESK_Y+2,SHELF_Y-524);

const damaged=()=>mode()==="extreme"||mode()==="progamer";

  <div class="row"><label for="an">HALF-LIVES (N)</label><input id="an" inputmode="numeric" autocomplete="off" style="width:60px" value="${esc(a.n||"")}"></div>
  <div class="row"><label for="aa">AGE</label><input id="aa" inputmode="decimal" autocomplete="off" style="width:110px" value="${esc(a.age||"")}"><span>${r.unit}</span></div>
  <h5>PRESERVATION NOTES</h5><p>${esc(C.pres)}</p>`,8,8);
 P.field=mk("field",`<div class="hd"><b>FIELD REPORT</b><span>${c.code}</span></div>

function buildBar(){const bar=document.createElement("div");bar.id="bar";

 else if(kind==="stampT"&&s!==TA.type)bad=`Not ${s.toLowerCase()}. Read the Trilobite row in the guide again.`;
 else if(kind==="guide"&&st.id==="guide"&&s!==TA.period)bad=`The ${s} doesn't include 450 million years ago. Check the time scale again.`;
 else if(kind==="calc"&&st.id==="calc"&&+s!==450)bad="That's not 5 × 90. Press C and try again.";
 if(!bad)return true;tutWarn(bad);snd("buzz");return kind==="calc"}
let tutWT;function tutWarn(m){const w=$("#tutw");if(!w)return;w.textContent="✗ "+m;clearTimeout(tutWT);tutWT=setTimeout(()=>{if($("#tutw"))$("#tutw").textContent=""},7000)}
function tutRender(){const s=STEPS[TUT.i];
 $("#tut").innerHTML=`<div class="th"><canvas width="40" height="48" id="tutcv"></canvas>${esc(BOSS.toUpperCase())} · TRAINING<em>STEP ${TUT.i+1} / ${STEPS.length}</em></div><div class="tb${s.say().length>170?" long":""}">${esc(s.say())}<div class="tw" id="tutw"></div></div>${s.next?`<div class="tf"><button class="btn" type="button" id="tutNext">${esc(s.next)} ▸</button></div>`:""}`;
 paint($("#tutcv"),person(BOSS_SEED,"boss"));if(s.next)$("#tutNext").onclick=()=>{snd("paper");tutAdvance()}}
function tutAdvance(){if(!TUT)return;TUT.i++;if(TUT.i>=STEPS.length)return endTutorial();const s=STEPS[TUT.i];s.enter&&s.enter();tutRender();snd("page");tutTick()}
function tutTick(){if(!TUT)return;const s=STEPS[TUT.i];if(s.done&&s.done())return tutAdvance();
 const el=s.target&&s.target(),ring=$("#tutRing"),ar=$("#tutArrow");
 if(!el||el.classList.contains("hide")||!el.isConnected){ring.classList.add("hide");ar.classList.add("hide");return}
 const r=stageRect(el),up=r.y<110;ring.classList.remove("hide");ar.classList.remove("hide");
 Object.assign(ring.style,{left:r.x-6+"px",top:r.y-6+"px",width:r.w+12+"px",height:r.h+12+"px"});
 ar.classList.toggle("up",up);ar.style.left=Math.round(clamp(r.x+r.w/2-16,4,W-36))+"px";ar.style.top=Math.round(up?r.y+r.h+10:r.y-32)+"px"}
function startTutorial(){if(TUT)clearInterval(TUT.tick);TUT=null;clearDesk();endTutUI();S.tut=true;S.tcase=makeTutCase();S.cases=null;S.idx=0;S.phase="arrive";S.start=Date.now();S.secs=0;S.result=null;
 lastCalc=null;applyMode();idCard();save();clock();TUT={i:0,handed:false};
 stage.insertAdjacentHTML("beforeend",`<div id="tut" role="dialog" aria-live="polite" aria-label="Tutorial"></div><button class="btn" id="tutSkip" type="button">SKIP TUTORIAL ▸▸</button><div id="tutRing" class="hide"></div><div id="tutArrow" class="hide"></div>`);
 $("#tutSkip").onclick=()=>{snd("paper");endTutorial()};
 later(()=>{if(TUT)showSil(BOSS_SEED,"boss")},300);tutRender();TUT.tick=setInterval(tutTick,200)}
function endTutUI(){["#tut","#tutSkip","#tutRing","#tutArrow"].forEach(s=>$(s)?.remove())}
function endTutorial(){if(!TUT)return;clearInterval(TUT.tick);TUT=null;endTutUI();clearDesk();
 stowTools();
 hideSil();S.tut=false;S.tcase=null;save();later(newShift,700)}


/* ---------- pause menu: resume, restart, main menu ---------- */
function stowTools(){if(bookOpen()||BK.offsetTop<SHELF_Y-60)stowBook();if(CL.offsetTop<SHELF_Y-60)flyTo(CL,...CALC_REST);cx="";lastCalc=null;$("#cdisp").textContent="0"}
function pause(){if(!S||$("#ovl").children.length)return;closeList();if(typing())document.activeElement.blur();S.pausedAt=Date.now();save();snd("paper");
 const where=S.tut?"Practice case":S.phase==="env"||S.phase==="done"?"Shift over":`Case ${S.idx+1} of ${S.cfg.cases}`;
 $("#ovl").innerHTML=`<div class="scr pause"><div class="pmenu" role="dialog" aria-label="Game paused"><h1>PAUSED</h1><div class="psub">${where} · ${esc(DIFFS[mode()].name)} · ${limit()&&!S.tut?"Time left "+$("#pInfo").dataset.left:"Time "+$("#pInfo").dataset.t}</div><div id="pbody"></div></div></div>`;pmain()}
function pmain(){$("#pbody").innerHTML=`<button class="btn" type="button" id="pRes">▸ RESUME</button><button class="btn alt" type="button" id="pRe">${S.tut?"RESTART TUTORIAL":"RESTART SHIFT"}</button><button class="btn red" type="button" id="pMenu">MAIN MENU</button><button class="btn alt" type="button" id="pSet">⚙ SETTINGS</button>`;$("#pSet").onclick=()=>{snd("key");$("#pbody").innerHTML=`<div class="psetin">${settingsHtml("◁ BACK")}</div>`;bindSettings($("#pbody"),pmain)};
 $("#pRes").onclick=resume;$("#pRes").focus();
 $("#pRe").onclick=()=>pask(S.tut?"Start the tutorial again from step 1?":"Start a new shift with new folders? Your answers in this shift will be lost.",S.tut?"YES, RESTART":"YES, NEW SHIFT",restart);
 $("#pMenu").onclick=()=>pask("Go back to the title screen? This shift will be lost and you will fill in the form again.","YES, MAIN MENU",goMenu)}
function pask(msg,yes,go){$("#pbody").innerHTML=`<p>${esc(msg)}</p><button class="btn red" type="button" id="pYes">${esc(yes)}</button><button class="btn" type="button" id="pNo">CANCEL</button>`;snd("key");
 $("#pYes").onclick=go;$("#pNo").onclick=()=>{snd("key");pmain()}}
function unpause(){if(S&&S.pausedAt){S.start+=Date.now()-S.pausedAt;delete S.pausedAt;save()}}
function resume(){unpause();$("#ovl").innerHTML="";snd("paper")}
function restart(){unpause();$("#ovl").innerHTML="";snd("paper");stowTools();hideSil();if(S.tut)startTutorial();else{if(TUT){clearInterval(TUT.tick);TUT=null;endTutUI()}newShift()}}
function goMenu(){fadeTo(goMenuNow)}
function goMenuNow(){if(TUT){clearInterval(TUT.tick);TUT=null;endTutUI()}clearDesk();stowTools();hideSil();clearInterval(timer);S=null;try{localStorage.removeItem(STORE)}catch(e){}
 applyMode();$("#idNames").innerHTML="";$("#idHead").textContent="INSPECTOR ID";$("#pCase").textContent="C#-";$("#pInfo").textContent="CASE -";snd("paper");title()}
$("#pauseBtn").onclick=pause;

/* ---------- boot ---------- */
makeTextures();applyTs();flickerLoop();setTimeout(()=>$("#fade").classList.remove("on"),60);
drawOffice();drawCounter();drawShelf();drawSpeaker();drawDesk();buildCalc();buildBook();buildBar();resetStamps();$("#pInfo").dataset.t="00:00";
S=load();if(S&&(!S.p||!S.cfg||!S.av))S=null;
if(S&&S.pausedAt)unpause();
if(!S||(!S.cases&&!S.tut))title();
else if(S.tut)startTutorial();
else{applyMode();idCard();clock();
 if(S.phase==="done"){showSil(S.start%100000,true);spawnEnv(false);$("#env").classList.add("open");results()}
 else if(S.phase==="env"){showSil(S.start%100000,true);spawnEnv(false)}
 else if(S.phase==="arrive")nextArrival();
 else{showSil(0,false,cur());spawnFolder(false);S.phase="desk";save()}}
window.ML_DEBUG={crew:CREW,crewArt,silOf,ads:ADS,menuAd:i=>{if(M){M.ad=i==='bee'?BEE_AD:ADS[i];drawMenuBg()}},pickAd,bee:BEE_AD,aim:k=>toClient(...aimPoint(k)),timeUp:()=>timeUp(),state:()=>S,cases:CASES,makeCase,save,guide:GUIDE,tut:()=>TUT,steps:STEPS,tutcase:TUTCASE};
}
