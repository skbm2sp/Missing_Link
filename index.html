<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Missing Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: night shift at a museum intake window, after Papers, Please.
   IDEA: a dark office behind the counter, a silhouetted reporter, a teal desk, a shelf of instruments below.
   PICTURE: pixel scenery drawn on small canvases and scaled up; papers in cream, lilac and pink.
   COLOUR and TYPE: dark browns and greys, muted teal desk, red and green stamps. VT323 for text, Silkscreen for labels.
   LAYOUT: fixed 1280x960 stage (4:3, fits iPads exactly) scaled to the screen. */
:root{--t:"VT323","Courier New",monospace;--l:"Silkscreen","Courier New",monospace;--line:#1b1714;--ink:#2b2622;--muted:#6d6456;--red:#b83a2e;--grn:#4f7a24;--amber:#e0b04a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden;font:20px/1.1 var(--t);color:var(--ink);-webkit-text-size-adjust:100%;-webkit-touch-callout:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hide{display:none!important}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:1280px;height:960px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:#1a1613}
.layer{position:absolute}
#desk{left:0;top:330px;width:1280px;height:530px;background-color:#6f9284;background-size:8px 8px}
#world{position:absolute;inset:0;pointer-events:none}#world>*{pointer-events:auto}
#sil{position:absolute;left:540px;top:12px;width:200px;height:240px;transition:transform .6s steps(8)}
#sil.out{transform:translateX(-760px)}#sil.gone{transform:translateX(760px)}
#bubbles{position:absolute;left:0;top:0;width:1280px;height:250px;pointer-events:none}
.bub{position:absolute;max-width:300px;background:#efe9d8;border:3px solid var(--line);padding:5px 10px;font:22px/1.05 var(--t);color:var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.45)}
#handZone{position:absolute;left:0;top:250px;width:1280px;height:80px;pointer-events:none;z-index:2}
#handZone.hot{outline:5px dashed var(--amber);outline-offset:-8px;background:rgba(224,176,74,.18)}
#handZone.hot:after{content:"HAND BACK";position:absolute;left:0;right:0;top:28px;text-align:center;font:12px var(--l);color:#1d2a22}
/* shelf */
.shelfitem{position:absolute}
#caseplate{left:18px;top:868px;width:176px;height:84px;background:#e9e1c3;border:4px solid var(--line);box-shadow:inset 0 0 0 3px #cfc49f;padding:4px 10px;line-height:1}
#caseplate b{display:block;font:700 26px/1 var(--l);color:#2b2622}
#caseplate span{font:18px/1 var(--t);color:var(--muted);white-space:nowrap}
#pauseBtn{left:412px;top:880px;width:124px;height:64px;padding:0;font-size:12px}
.scr.pause{background:rgba(13,11,10,.8)}
.pmenu{width:540px;background:#e5dcc4;color:var(--ink);border:4px solid var(--line);box-shadow:10px 10px 0 #000;padding:26px 32px 14px;text-align:center}
.pmenu h1{font:700 48px/1 var(--l);margin:0 0 6px}.psub{font:22px var(--t);color:var(--muted);margin-bottom:22px}
.pmenu .btn{display:block;width:100%;height:60px;margin:0 0 14px;font-size:15px}.pmenu p{font:24px/1.1 var(--t);margin:0 0 18px}
.btn.red{background:#c9705d;box-shadow:inset 0 -6px 0 #8f3a2e;color:#1e0e0a}
#speaker{left:548px;top:878px;width:176px;height:72px;border:0;padding:0;background:none}
#speaker canvas{width:176px;height:72px}
#speaker em{position:absolute;left:0;right:0;bottom:-2px;font:8px var(--l);font-style:normal;color:#d8c9a8;text-align:center}
#idcard{left:1052px;top:868px;width:216px;height:86px;background:#ece7da;border:4px solid var(--line);box-shadow:inset 0 0 0 3px #d2cbb8;padding:4px 8px;overflow:hidden}
#idcard .ih{font:8px var(--l);color:#fff;background:#3b4a5c;margin:-4px -8px 4px;padding:3px 8px;white-space:nowrap;overflow:hidden}
#idcard .pr{display:flex;align-items:center;gap:6px;height:30px;margin-bottom:3px}
#idcard .pr canvas{width:25px;height:30px;border:2px solid var(--line);background:#b9b2a0;flex:none}
#idcard .pr.big{height:50px;margin:0}#idcard .pr.big canvas{width:38px;height:46px}#idcard .pr.big .nm{line-height:1}#idcard .pr.big .sc{font-size:15px}
#idcard .pr .nm{font-size:17px}
#idcard .nm{font:19px/1 var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#idcard .sc{font:16px/1 var(--t);color:var(--muted)}
#nomanual{left:752px;top:878px;width:284px;height:70px;background:#e9e1c3;border:4px solid var(--line);padding:8px 10px;font:20px/1 var(--t);color:var(--ink);transform:rotate(-2deg);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
#nomanual b{display:block;font:700 11px var(--l);color:var(--red);margin-bottom:4px}
/* draggable objects */
.obj{position:absolute;touch-action:none;cursor:grab}
.obj.dragging{cursor:grabbing;filter:drop-shadow(8px 10px 0 rgba(0,0,0,.35))}
.fly{transition:left .3s steps(7),top .3s steps(7)}
.slide{transition:left .8s steps(12),top .8s steps(12),opacity .8s steps(12)}
/* folder */
.folder{width:400px;height:520px;perspective:1800px}
.fback{position:absolute;inset:0;background:#a8874a;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.35),inset 0 0 0 6px #b8975a}
.ftab{position:absolute;left:260px;top:-22px;width:100px;height:26px;background:#c4a466;border:4px solid var(--line);border-bottom:0}
.fcover{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform .4s steps(6)}
.folder.open .fcover{transform:rotateY(-179deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid var(--line)}
.front{background:#d2bf74;box-shadow:inset 0 -12px 0 #bba95f,inset 0 0 0 6px #dccb84;padding:36px 30px}
.inside{transform:rotateY(180deg);background:#c7b46b;box-shadow:inset 0 0 0 6px #b8a55c;padding:30px 28px;cursor:pointer}
.casetag{display:inline-block;font:700 34px/1 var(--l);color:var(--ink);border:4px solid var(--ink);padding:10px 16px;background:#e9dfb6}
.flabel{position:absolute;left:30px;right:30px;bottom:30px;font:24px/1.05 var(--t);color:#4a3e15}
.flabel span{display:block;font:10px var(--l);color:#6a5a25;margin-top:6px}
.inside p{font:22px/1.05 var(--t);color:#4a3e15;margin:0}
.closer{position:absolute;left:28px;right:28px;bottom:30px;border:4px dashed #6a5a25;padding:14px;text-align:center;font:11px/1.6 var(--l);color:#4a3e15}
/* papers */
.paper{width:380px;border:3px solid var(--line);box-shadow:5px 5px 0 rgba(0,0,0,.35);font:18px/1.02 var(--t);color:var(--ink);padding:5px}
.paper .in{border:2px solid rgba(0,0,0,.28);padding:7px 9px 9px;position:relative}
.paper .hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid rgba(0,0,0,.35);padding-bottom:4px;margin-bottom:6px}
.paper .hd b{font:700 13px var(--l)}.paper .hd span{font:18px var(--t);color:var(--muted)}
.paper dl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0}
.paper dt{color:var(--muted)}.paper dd{margin:0}
.paper h5{margin:6px 0 1px;font:9px var(--l);color:var(--muted)}
.paper ul{margin:0;padding-left:14px}.paper li{margin:0 0 1px}
.paper p{margin:0}
#lab{background:#e7dec6}#field{background:#d9d2e4}#idf{background:#ecd3cc}
.pct{font:44px/1 var(--t);color:var(--red)}
.row{display:flex;align-items:center;gap:8px;margin-top:5px}
.row label,.lbl{font:9px var(--l);color:var(--muted)}
.paper input{height:30px;border:0;border-bottom:2px solid var(--line);background:rgba(255,255,255,.45);font:24px/1 var(--t);padding:0 5px;border-radius:0;min-width:0}
.ptop{display:grid;grid-template-columns:84px 1fr;gap:9px;align-items:start}
.idphoto{width:84px;height:100px;border:3px solid var(--line);background:#b9b2a0;overflow:hidden}
.idphoto canvas{width:78px;height:94px}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sbox{position:relative;height:96px;border:3px dashed #8a6a62;display:grid;place-items:center}
.sbox>em{position:absolute;left:5px;top:3px;font:8px var(--l);font-style:normal;color:#7a5e57}
.ink{font:24px/.95 var(--t);text-transform:uppercase;border:4px solid currentColor;padding:4px 6px;text-align:center;opacity:.85;max-width:150px;transform:rotate(var(--r))}
.ink.P{color:var(--red)}.ink.T{color:var(--grn)}
.seal{position:absolute;right:8px;bottom:6px;font:9px var(--l);color:#7a5e57}
.gram{display:flex;flex-wrap:wrap;gap:0 18px;font:21px/1.1 var(--t);margin:2px 0 4px}.gram span{white-space:nowrap}.gram b{font:28px/1 var(--t);color:var(--red)}
.smudge{color:#8a7f6a;font-style:italic}.rd{display:inline-block;width:52%;height:13px;background:#2b2622;vertical-align:middle}
.nophoto{width:78px;height:94px;display:grid;place-items:center;text-align:center;font:9px/1.6 var(--l);color:#5a5246;background:repeating-linear-gradient(45deg,#b9b2a0 0 6px,#ada592 6px 12px)}
/* pixel dropdown */
.psel{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:32px;padding:0 6px;border:3px solid var(--line);background:#d8d0b8;box-shadow:inset 0 -4px 0 #a99f84;font:21px/1 var(--t);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden}
.psel i{font-style:normal;font-size:14px;flex:none}
.psel.empty span{color:var(--muted)}
.plist{position:absolute;z-index:95000;background:#e3dcc6;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4);max-height:380px;overflow:auto;padding:3px;touch-action:pan-y}
.plist button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:4px 8px;font:21px/1.05 var(--t);min-height:32px}
.plist button:hover,.plist button.on{background:#3b4a32;color:#e9eed6}
.plist .grp{font:8px var(--l);color:var(--muted);padding:6px 8px 2px}
/* manual (no page animation) */
.book{width:300px;height:450px}
.book.open{width:600px}
.bcase{position:absolute;inset:-7px;background:#6e2520;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.pg{position:absolute;top:0;width:300px;height:450px;background:#e9e1c9;border:3px solid var(--line);padding:12px 14px 28px;overflow:hidden;font:19px/1.02 var(--t)}
.pgL{left:0}.pgR{left:300px}
.pgW{left:0;width:600px}
.pg h3{margin:0 0 6px;font:700 12px var(--l);color:#2f3a2a}
.pg h4{margin:7px 0 1px;font:9px var(--l);color:#7a2a20}
.pg p,.pg li{margin:2px 0}.pg ol{margin:0;padding-left:20px;font-size:18px;line-height:1}.pg ol li{margin:0 0 5px}
.pg table{border-collapse:collapse;width:100%;font:18px/1 var(--t)}
.pg td,.pg th{border:2px solid #b5a988;padding:1px 4px;text-align:left;vertical-align:top}.pg th{background:#d6caa8;font:8px var(--l)}
.pg .nw td{white-space:nowrap}
.pg .ts tr.era td{background:#e0d4b2;font:700 8px/16px var(--l);color:#7a2a20}
.pg .removed{font:700 11px var(--l);color:var(--red);border:3px solid var(--red);padding:6px;text-align:center;margin:10px 0 12px;transform:rotate(-3deg)}
.gsel{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gsel .lbl{flex:none}
#gtable{height:330px;overflow:auto;touch-action:pan-y;font-size:16px;position:relative}
#gtable table{table-layout:fixed;font-size:16px}#gtable th:first-child{width:140px}
#gtable td:first-child{font-weight:700;overflow-wrap:anywhere}
#gtable.more:after{content:"▼ SCROLL FOR MORE";position:sticky;bottom:0;display:block;text-align:center;background:#d6caa8;font:8px/18px var(--l);color:#2f3a2a}
.gnote{font:16px var(--t);color:var(--muted);margin-top:4px}
.names{columns:3;column-gap:14px;font-size:16px;line-height:1.05}.names div{break-inside:avoid;border-bottom:2px dotted #c8bc9b;padding:1px 0}
.pno{position:absolute;bottom:6px;font:8px var(--l);color:var(--muted)}
.pgL .pno,.pgW .pno{left:14px}.pgR .pno{right:14px}
.btabs{position:absolute;left:600px;top:14px;display:flex;flex-direction:column;gap:5px}
.btab{width:100px;height:40px;border:3px solid var(--line);border-left:0;padding:2px 6px 2px 10px;text-align:left;font:8px/1.3 var(--l);color:#241d10;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
.btab.on{transform:translateX(6px)}
.book.closed .bcase,.book.closed .pg,.book.closed .btabs{display:none}
.book.open .cover{display:none}
.cover{position:absolute;inset:0;background:#a8362c;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4),inset 14px 0 0 #7d241c;padding:16px 16px 0 30px;color:#f1d9cf}
.cover .lab{display:block;background:#f3e3df;color:#3a1a14;border:3px solid var(--line);font:700 15px/1 var(--l);padding:7px;text-align:center;margin-bottom:22px}
.cover canvas{width:96px;height:96px;margin:0 auto 18px}
.cover .bn{font:12px/1.7 var(--l);text-align:center}
/* calculator */
.calc{width:170px;height:236px;background:#2c2d2c;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.4),inset 0 5px 0 #3e403e,inset 0 -7px 0 #1f201f;padding:10px}
.cdisp{height:40px;background:#9fc4d6;border:3px solid var(--line);box-shadow:inset 3px 3px 0 #7ea3b5;font:32px/32px var(--t);color:#1d2b33;text-align:right;padding:0 6px;overflow:hidden;white-space:nowrap;margin-bottom:8px}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ckeys button{height:30px;border:3px solid var(--line);background:#47484a;color:#e3e5d7;font:24px/1 var(--t);box-shadow:inset 0 -4px 0 #2f3031;padding:0}
.ckeys button.op{background:#b58a3a;color:#24180a;box-shadow:inset 0 -4px 0 #8a6520}.ckeys button.cl{background:#8f3a2e;box-shadow:inset 0 -4px 0 #642419}
.ckeys button:active{box-shadow:none;transform:translateY(2px)}
/* stamp bar */
#bar{position:absolute;top:334px;width:754px;height:176px;z-index:30000;transition:left .35s steps(7)}
#bartab{position:absolute;left:0;top:30px;width:38px;height:116px;background:#3b3128;border:4px solid var(--line);border-right:0;color:#d9c9a3;font:9px/1.1 var(--l);padding:0;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-1px}
#barbase{position:absolute;left:34px;top:0;width:720px;height:176px}
.mach{position:absolute;top:0;width:160px;height:140px}
.mach .knob{position:absolute;left:52px;top:0;width:56px;height:64px;transition:transform .08s steps(2)}
.mach .body{position:absolute;left:0;top:44px;width:160px;height:92px;transition:transform .08s steps(2)}
.mach.press .knob{transform:translateY(16px)}.mach.press .body{transform:translateY(8px)}
.mach .val{position:absolute;left:22px;top:100px;width:116px;height:28px;border:0;padding:0 4px;background:transparent;font:9px/1.05 var(--l);display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;z-index:2}

.aim{position:absolute;top:176px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:14px solid #e0b04a}
#barlabel{position:absolute;left:0;right:0;top:150px;text-align:center;font:9px var(--l);color:#a99c86;pointer-events:none}
/* envelope */
/* envelope: back, letter, front pocket and flap are separate layers, so the letter slides out
   in front of the opened flap and stays tucked behind the pocket */
.env{width:300px;height:190px;cursor:pointer}
.env>canvas{position:absolute;left:0;width:300px}
.env .eback{top:0;height:190px;z-index:1;filter:drop-shadow(6px 6px 0 rgba(0,0,0,.4))}
.env .letter{position:absolute;left:24px;top:16px;width:252px;height:164px;background:#e9e1c9;border:3px solid var(--line);z-index:2;padding:10px 14px;transition:transform .5s .45s steps(8)}
.env .letter b{display:block;font:700 11px var(--l);color:#2f3a2a;margin-bottom:8px}
.env .letter i{display:block;height:4px;background:#b9ae90;margin:7px 0}
.env .efront{top:0;height:190px;z-index:3;pointer-events:none}
.env .flap{top:0;height:120px;z-index:4;transform-origin:50% 0;transition:transform .4s steps(6),z-index 0s .4s;pointer-events:none}
.env .wax{position:absolute;left:130px;top:98px;width:40px;height:40px;background:var(--red);border:4px solid var(--line);color:#f3c9a8;font:12px/32px var(--l);text-align:center;z-index:5}
.env .et{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:10px/1.6 var(--l);color:#3d2a12;z-index:5;pointer-events:none}
.env.open .flap{transform:scaleY(-1);z-index:1}.env.open .wax,.env.open .et{visibility:hidden}
.env.open .letter{transform:translateY(-66px)}
/* screens */
#toast{position:absolute;left:640px;top:806px;transform:translateX(-50%);z-index:80000;background:#efe9d8;color:var(--ink);padding:6px 12px;font:21px/1.05 var(--t);border:3px solid var(--line);box-shadow:4px 4px 0 rgba(0,0,0,.4);max-width:760px;pointer-events:none;white-space:nowrap}
.scr{position:absolute;inset:0;z-index:90000;background:#0d0b0a;display:grid;place-items:center;color:#cfc8b4}

.title{font:700 64px/1 var(--l);color:#cfc8b4;text-align:center;margin:0 0 6px;letter-spacing:2px}
.sub{font:24px var(--t);color:#8d8572;text-align:center;margin:0 0 22px}
.reg h2{font:700 14px var(--l);margin:0 0 6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.inp{width:100%;height:40px;border:3px solid var(--line);background:#f2ecda;font:26px/1 var(--t);padding:0 8px;border-radius:0}
.btn{height:46px;padding:0 22px;border:4px solid var(--line);background:#b89a5c;color:#1e170c;font:700 13px var(--l);box-shadow:inset 0 -6px 0 #8a7038}
.btn:active{box-shadow:none;transform:translateY(3px)}
.err{color:var(--red);font:22px var(--t);min-height:24px;margin:8px 0 2px}
.res{width:980px;font:24px/1.1 var(--t)}

.res td:first-child,.res th:first-child{text-align:left}
.ok{color:#8fbf5a}.no{color:#e0675a}
.ledger{width:440px;margin:0 auto 16px;display:grid;grid-template-columns:1fr auto;gap:2px 20px}

.res td,.res th{padding:3px 8px}
/* title */
.ttl{text-align:center}
.ttl canvas{width:288px;height:192px;margin:0 auto 10px}
.ttl .kick{font:12px var(--l);color:#8d8572;letter-spacing:2px}
.ttl .big{font:700 96px/1 var(--l);color:#e9dfc2;letter-spacing:4px;margin:8px 0 4px;text-shadow:6px 6px 0 #3b3128}
.ttl .bar{width:520px;height:8px;background:#b89a5c;margin:18px auto 34px;box-shadow:4px 4px 0 #3b3128}
.ttl .btn{display:block;width:460px;height:68px;margin:0 auto 18px;font-size:18px}
.ttl .foot{font:20px var(--t);color:#6d6456;margin-top:26px}
.btn.alt{background:#8fb8a5;box-shadow:inset 0 -6px 0 #617b6f}
/* menu (inspector application) */
.backb{position:absolute;left:24px;top:22px;height:48px;padding:0 18px;font-size:12px}
.form{position:absolute;left:150px;top:24px;width:980px;background:#e5dcc4;color:var(--ink);border:4px solid var(--line);box-shadow:10px 10px 0 #000;padding:8px}
.form>.in{border:2px solid rgba(0,0,0,.3);padding:12px 22px 14px}
.form h1{font:700 40px/1 var(--l);margin:0;text-align:center}
.form .fsub{text-align:center;font:20px var(--t);color:var(--muted);margin:2px 0 8px}
.form label,.form .lab{display:block;font:9px var(--l);color:var(--muted);margin:0 0 3px}
.prow{display:grid;grid-template-columns:96px 1fr 1fr;gap:0 16px;align-items:end;margin-bottom:10px}
.prow .who2{grid-column:1/-1;font:9px var(--l);color:#7a2a20;margin-bottom:2px}
.avb{width:96px;height:118px;border:3px solid var(--line);background:#b9b2a0;padding:3px;position:relative;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
.avb canvas,.avb img{width:84px;height:100px;display:block;image-rendering:pixelated}
.avb span{position:absolute;left:0;right:0;bottom:2px;font:7px var(--l);color:#fff;background:rgba(27,23,20,.75);padding:2px 0}
.cols{display:grid;grid-template-columns:420px 1fr;gap:0 26px;margin-top:6px}
.fld{margin-bottom:10px}
.ddesc{height:92px;border:3px solid #b5a988;background:#efe7d0;padding:6px 9px;font:19px/1.05 var(--t);margin-top:6px}
.ddesc b{display:block;font:700 10px var(--l);margin-bottom:3px}
.form .chk,.chk{display:flex;align-items:center;gap:10px;font:22px/1 var(--t);color:var(--ink);margin:0;cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:30px;height:30px;margin:0;border:3px solid var(--line);background:#f2ecda;display:grid;place-items:center;flex:none}
.chk input:checked:after{content:"";width:14px;height:14px;background:var(--grn);box-shadow:inset 0 -3px 0 #3a5a18}
.sigbox{position:relative;width:100%;height:190px;border:3px solid var(--line);background:#f2ecda;touch-action:none;cursor:crosshair}
.sigbox canvas{width:100%;height:100%;image-rendering:pixelated}
.sigbox .x{position:absolute;left:14px;bottom:30px;font:28px var(--t);color:var(--muted);pointer-events:none}
.sigbox .ln{position:absolute;left:44px;right:14px;bottom:36px;border-bottom:2px solid var(--muted);pointer-events:none}
.sigbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:5px;font:18px var(--t);color:var(--muted)}
.sbtn{height:34px;padding:0 12px;border:3px solid var(--line);background:#d8d0b8;font:9px var(--l);box-shadow:inset 0 -4px 0 #a99f84}
.fend{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:20px}
.fend .err{margin:0;flex:1}
/* photo picker */
.pick{position:absolute;inset:0;z-index:2;background:rgba(13,11,10,.82);display:grid;place-items:center}
.pick .pan{color:var(--ink);width:860px;background:#e5dcc4;border:4px solid var(--line);box-shadow:10px 10px 0 #000;padding:16px 20px}
.pick h2{font:700 18px var(--l);margin:0 0 4px;display:flex;justify-content:space-between;align-items:center}
.pick h3{font:9px var(--l);color:var(--muted);margin:10px 0 6px}
.pgrid{display:grid;grid-template-columns:repeat(7,104px);gap:10px}
.ptile{width:104px;height:124px;border:3px solid var(--line);background:#b9b2a0;padding:4px;position:relative}
.ptile canvas,.ptile img{width:90px;height:108px;display:block;image-rendering:pixelated}
.ptile.on{outline:5px solid var(--amber);outline-offset:1px}
.ptile .del{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border:3px solid var(--line);background:#8f3a2e;color:#fff;font:14px/1 var(--t);padding:0}
.ptile.add{background:#d8c47e;display:grid;place-items:center;text-align:center;font:8px/1.5 var(--l);color:#3b3128}
.ptile.add canvas{width:64px;height:48px;margin:0 auto 6px}
/* tutorial */
#tut{position:absolute;left:16px;top:12px;width:512px;z-index:84000;background:#efe9d8;border:4px solid var(--line);box-shadow:6px 6px 0 rgba(0,0,0,.5);color:var(--ink)}
#tut .th{display:flex;align-items:center;gap:8px;background:#3b4a5c;color:#fff;font:9px var(--l);padding:4px 8px}
#tut .th canvas{width:30px;height:36px;background:#b9b2a0;border:2px solid #1b1714}
#tut .th em{font-style:normal;margin-left:auto;color:#cfd8e3}
#tut .tb{padding:8px 12px 6px;font:22px/1.08 var(--t);min-height:74px}
#tut .tw{color:var(--red);font:21px/1.05 var(--t);margin-top:6px}
#tut .tf{display:flex;justify-content:flex-end;padding:0 10px 8px}
#tut .tf .btn{height:38px;font-size:11px;padding:0 16px}
#tutSkip{position:absolute;right:16px;top:12px;z-index:84000;height:40px;padding:0 14px;font-size:10px}
#tutRing{position:absolute;z-index:85000;border:4px dashed var(--amber);pointer-events:none;animation:blink 1s steps(2) infinite}
#tutArrow{position:absolute;z-index:85001;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:22px solid var(--amber);pointer-events:none;filter:drop-shadow(3px 3px 0 #1b1714);animation:bob .7s steps(2) infinite}
#tutArrow.up{border-top:0;border-bottom:22px solid var(--amber)}
@keyframes blink{50%{border-color:#fff3c4}}
@keyframes bob{50%{translate:0 6px}}
#rot{position:fixed;inset:0;background:#0d0b0a;color:#cfc8b4;display:none;place-items:center;text-align:center;padding:30px;z-index:99999;font:12px/1.8 var(--l)}
@media (orientation:portrait) and (max-width:900px){#rot{display:grid}}
@media(prefers-reduced-motion:reduce){.fcover,.fly,.slide,#sil,#bar,.env .letter,.env .flap{transition:none}}
</style>
</head>

function unpause(){if(S&&S.pausedAt){S.start+=Date.now()-S.pausedAt;delete S.pausedAt;save()}}
function resume(){unpause();$("#ovl").innerHTML="";snd("paper")}
function restart(){unpause();$("#ovl").innerHTML="";snd("paper");stowTools();hideSil();if(S.tut)startTutorial();else{if(TUT){clearInterval(TUT.tick);TUT=null;endTutUI()}newShift()}}
function goMenu(){if(TUT){clearInterval(TUT.tick);TUT=null;endTutUI()}clearDesk();stowTools();hideSil();clearInterval(timer);S=null;try{localStorage.removeItem(STORE)}catch(e){}
 applyMode();$("#idNames").innerHTML="";$("#idHead").textContent="INSPECTOR ID";$("#pCase").textContent="C#-";$("#pInfo").textContent="CASE -";snd("paper");title()}
$("#pauseBtn").onclick=pause;

/* ---------- boot ---------- */
drawOffice();drawCounter();drawShelf();drawSpeaker();drawDesk();buildCalc();buildBook();buildBar();resetStamps();$("#pInfo").dataset.t="00:00";
S=load();if(S&&(!S.p||!S.cfg||!S.av))S=null;
if(S&&S.pausedAt)unpause();
if(!S||(!S.cases&&!S.tut))title();
else if(S.tut)startTutorial();
else{applyMode();idCard();clock();
 if(S.phase==="done"){showSil(S.start%100000,true);spawnEnv(false);$("#env").classList.add("open");results()}
 else if(S.phase==="env"){showSil(S.start%100000,true);spawnEnv(false)}
 else if(S.phase==="arrive")nextArrival();
 else{showSil(cur().seed);spawnFolder(false);S.phase="desk";save()}}
window.ML_DEBUG={state:()=>S,cases:CASES,makeCase,save,guide:GUIDE,tut:()=>TUT,steps:STEPS,tutcase:TUTCASE};
}
</script>
